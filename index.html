<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI顔診断</title>

<style>

body {
  font-family: sans-serif;
  background: #f5f5f5;
  text-align: center;
  padding: 20px;
  margin: 0;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
  margin-top: 0;
}

input[type="text"] {
  width: 90%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 10px;
}

.consent {
  text-align: left;
  background: #f0f0f0;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
}

button:disabled {
  background: #aaa;
}

video {
  width: 100%;
  border-radius: 15px;
  margin-top: 20px;
}

#photo {
  width: 100%;
  border-radius: 15px;
  margin-top: 20px;
}

.result {
  margin-top: 20px;
  background: #f7f7f7;
  padding: 20px;
  border-radius: 15px;
}

.score {
  font-size: 48px;
  font-weight: bold;
  margin: 10px;
}

.resultItem {
  margin: 12px 0;
  font-size: 18px;
}

#cameraArea,
#resultArea,
#completeArea,
#diagnosisArea {
  display: none;
}

.small {
  font-size: 12px;
  color: #666;
}

</style>
</head>

<body>

<div class="container">

<h1>📸 AI顔診断</h1>

<div id="startArea">

<p>ニックネームを入力してください</p>

<input
  type="text"
  id="nickname"
  placeholder="ニックネーム"
>

<div class="consent">

<strong>写真の利用について</strong>

<p>
AI顔診断を行うため、カメラで顔写真を撮影します。
撮影した写真はサーバーへ送信され、AIが不正チェックを行います。
</p>

<p>
写真は診断・不正チェックの目的で使用します。
</p>

<label>

<input
  type="checkbox"
  id="consent"
>

内容を確認し、写真の撮影・送信に同意します

</label>

</div>

<button id="startButton" disabled>
診断を開始
</button>

</div>


<div id="cameraArea">

<h2>📷 カメラ</h2>

<video
  id="camera"
  autoplay
  playsinline
></video>

<button id="captureButton">
📸 撮影する
</button>

</div>


<div id="resultArea">

<h2>撮影した写真</h2>

<img
  id="photo"
  alt="撮影した写真"
>

<button id="sendButton">
写真を送信する
</button>

<button id="retakeButton">
もう一度撮影
</button>

</div>


<div id="completeArea">

<h2>📤 送信完了</h2>

<p>
写真の送信が完了しました。
</p>

</div>


<div id="diagnosisArea">

<div class="result">

<h2>🎉 診断結果</h2>

<p id="resultNickname"></p>

<div class="score">
<span id="totalScore">0</span>
<span style="font-size:20px;"> / 100</span>
</div>

<div class="resultItem">
😊 表情スコア：
<strong id="expressionScore"></strong>
</div>

<div class="resultItem">
✨ 雰囲気スコア：
<strong id="moodScore"></strong>
</div>

<div class="resultItem">
📸 写真映えスコア：
<strong id="photoScore"></strong>
</div>

<p class="small">
※この診断はエンターテインメント目的の参考値です。
</p>

</div>

</div>

</div>


<script>

const startArea =
  document.getElementById("startArea");

const cameraArea =
  document.getElementById("cameraArea");

const resultArea =
  document.getElementById("resultArea");

const completeArea =
  document.getElementById("completeArea");

const diagnosisArea =
  document.getElementById("diagnosisArea");

const nickname =
  document.getElementById("nickname");

const consent =
  document.getElementById("consent");

const startButton =
  document.getElementById("startButton");

const camera =
  document.getElementById("camera");

const captureButton =
  document.getElementById("captureButton");

const photo =
  document.getElementById("photo");

const sendButton =
  document.getElementById("sendButton");

const retakeButton =
  document.getElementById("retakeButton");

let cameraStream = null;
let photoBlob = null;


/* 同意チェック */

consent.addEventListener(
  "change",
  () => {

    startButton.disabled =
      !consent.checked;

  }
);


/* カメラ開始 */

startButton.addEventListener(
  "click",
  async () => {

    if (!nickname.value.trim()) {

      alert(
        "ニックネームを入力してください"
      );

      return;
    }

    try {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: "user"
          },

          audio: false

        });

      camera.srcObject =
        cameraStream;

      startArea.style.display =
        "none";

      cameraArea.style.display =
        "block";

    } catch (error) {

      console.error(error);

      alert(
        "カメラを起動できませんでした。"
      );

    }

  }
);


/* 写真撮影 */

captureButton.addEventListener(
  "click",
  () => {

    const canvas =
      document.createElement("canvas");

    canvas.width =
      camera.videoWidth;

    canvas.height =
      camera.videoHeight;

    const ctx =
      canvas.getContext("2d");

    /*
      前面カメラなので
      左右反転して保存
    */

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(
      -1,
      1
    );

    ctx.drawImage(
      camera,
      0,
      0,
      canvas.width,
      canvas.height
    );

    photo.src =
      canvas.toDataURL(
        "image/jpeg",
        0.9
      );

    canvas.toBlob(
      (blob) => {

        photoBlob = blob;

      },
      "image/jpeg",
      0.9
    );

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

    cameraArea.style.display =
      "none";

    resultArea.style.display =
      "block";

  }
);


/* 写真送信 */

sendButton.addEventListener(
  "click",
  async () => {

    if (!photoBlob) {

      alert(
        "写真がありません"
      );

      return;
    }

    sendButton.disabled =
      true;

    sendButton.textContent =
      "送信中...";

    try {

      const response =
        await fetch(
          "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/smooth-worker",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "image/jpeg"
            },

            body: photoBlob

          }
        );

      if (!response.ok) {

        throw new Error(
          "送信失敗"
        );

      }

      completeArea.style.display =
        "block";

      resultArea.style.display =
        "none";

      /*
        診断スコア作成
      */

      createDiagnosis();

    } catch (error) {

      console.error(error);

      alert(
        "写真の送信に失敗しました。"
      );

      sendButton.disabled =
        false;

      sendButton.textContent =
        "写真を送信する";

    }

  }
);


/* もう一度撮影 */

retakeButton.addEventListener(
  "click",
  async () => {

    resultArea.style.display =
      "none";

    try {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: "user"
          },

          audio: false

        });

      camera.srcObject =
        cameraStream;

      cameraArea.style.display =
        "block";

    } catch (error) {

      alert(
        "カメラを起動できませんでした。"
      );

    }

  }
);


/* 診断結果 */

function createDiagnosis() {

  /*
    エンタメ用の簡単なスコア
  */

  const expression =
    randomScore();

  const mood =
    randomScore();

  const photoScore =
    randomScore();

  const total =
    Math.round(
      (
        expression +
        mood +
        photoScore
      ) / 3
    );

  document.getElementById(
    "resultNickname"
  ).textContent =
    nickname.value.trim() +
    " さんの診断結果";

  document.getElementById(
    "totalScore"
  ).textContent =
    total;

  document.getElementById(
    "expressionScore"
  ).textContent =
    expression;

  document.getElementById(
    "moodScore"
  ).textContent =
    mood;

  document.getElementById(
    "photoScore"
  ).textContent =
    photoScore;

  diagnosisArea.style.display =
    "block";

}


function randomScore() {

  return Math.floor(
    Math.random() * 31
  ) + 70;

}

</script>

</body>
</html>
