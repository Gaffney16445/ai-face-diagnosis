```html
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI顔診断</title>

<style>

body {
    margin: 0;
    font-family: sans-serif;
    background: #f5f5f5;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 420px;
    margin: 60px auto;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    font-size: 30px;
}

p {
    color: #555;
    line-height: 1.7;
}

input {
    width: 100%;
    padding: 15px;
    margin: 15px 0;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

.consent {
    text-align: left;
    background: #f7f7f7;
    padding: 15px;
    border-radius: 10px;
    margin: 15px 0;
    font-size: 14px;
}

.checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
}

.checkbox input {
    width: auto;
    margin: 0;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 16px;
    margin-top: 10px;
}

button:disabled {
    background: #aaa;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>AI顔診断</h1>

        <p>
            あなたの顔をAIが診断します。
        </p>

        <input
            id="nickname"
            type="text"
            placeholder="ニックネーム"
            maxlength="20"
        >

        <div class="consent">

            <strong>写真の利用について</strong>

            <p>
                AI顔診断を行うため、カメラで顔写真を撮影します。
                撮影した写真はサーバーへ送信され、
                AIが不正チェックを行います。
            </p>

            <p>
                写真は診断・不正チェックの目的で使用します。
            </p>

            <label class="checkbox">
                <input type="checkbox" id="agree">
                <span>内容を確認し、写真の撮影・送信に同意します</span>
            </label>

        </div>

        <button id="startButton" disabled>
            AI顔診断を開始
        </button>

    </div>

</div>

<script>

const agree = document.getElementById("agree");
const startButton = document.getElementById("startButton");

agree.addEventListener("change", function() {

    startButton.disabled = !agree.checked;

});

startButton.addEventListener("click", function() {

    const nickname =
        document.getElementById("nickname").value.trim();

    if (nickname === "") {

        alert("ニックネームを入力してください。");
        return;

    }

    alert("次はカメラを起動します。");

});

</script>

</body>

</html>
```
