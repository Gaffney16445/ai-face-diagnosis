<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI顔診断</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #f5f5f5;
  text-align: center;
}

.container {
  width: 90%;
  max-width: 420px;
  margin: 40px auto;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
  font-size: 30px;
}

p {
  color: #555;
  line-height: 1.7;
}

input {
  width: 100%;
  padding: 15px;
  margin: 15px 0;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

.consent {
  text-align: left;
  background: #f7f7f7;
  padding: 15px;
  border-radius: 10px;
  margin: 15px 0;
  font-size: 14px;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
}

.checkbox input {
  width: auto;
  margin: 0;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 16px;
  margin-top: 10px;
}

button:disabled {
  background: #aaa;
}

#cameraArea,
#resultArea,
#completeArea {
  display: none;
}

video,
#photo {
  width: 100%;
  border-radius: 15px;
  margin-top: 15px;
  background: black;
}

.loading {
  font-size: 18px;
  margin: 20px 0;
}
</style>
</head>

<body>

<div class="container">

  <!-- 開始画面 -->
  <div class="card" id="startArea">

    <h1>AI顔診断</h1>

    <p>
      あなたの顔をAIが診断します。
    </p>

    <input
      id="nickname"
      type="text"
      placeholder="ニックネーム"
      maxlength="20"
    >

    <div class="consent">

      <strong>写真の利用について</strong>

      <p>
        AI顔診断を行うため、カメラで顔写真を撮影します。
        撮影した写真はサーバーへ送信され、不正チェックに使用します。
      </p>

      <p>
        写真は診断・不正チェックの目的で使用します。
      </p>

      <label class="checkbox">

        <input type="checkbox" id="agree">

        <span>
          内容を確認し、写真の撮影・送信に同意します
        </span>

      </label>

    </div>

    <button id="startButton" disabled>
      AI顔診断を開始
    </button>

  </div>


  <!-- カメラ画面 -->
  <div class="card" id="cameraArea">

    <h1>カメラ撮影</h1>

    <p>
      カメラに顔を映してください。
    </p>

    <video
      id="camera"
      autoplay
      playsinline
    ></video>

    <button id="takePhoto">
      📸 撮影する
    </button>

  </div>


  <!-- 撮影結果 -->
  <div class="card" id="resultArea">

    <h1>撮影完了</h1>

    <p>
      撮影した写真です。
    </p>

    <img id="photo">

    <button id="sendPhoto">
      写真を送信する
    </button>

    <button id="retakePhoto">
      もう一度撮影
    </button>

  </div>


  <!-- 完了画面 -->
  <div class="card" id="completeArea">

    <h1>送信完了</h1>

    <p>
      写真の送信が完了しました。
    </p>

    <p>
      これからAI顔診断を行います。
    </p>

  </div>

</div>


<script>

const agree =
  document.getElementById("agree");

const startButton =
  document.getElementById("startButton");

const startArea =
  document.getElementById("startArea");

const cameraArea =
  document.getElementById("cameraArea");

const resultArea =
  document.getElementById("resultArea");

const completeArea =
  document.getElementById("completeArea");

const camera =
  document.getElementById("camera");

const takePhoto =
  document.getElementById("takePhoto");

const photo =
  document.getElementById("photo");

const sendPhoto =
  document.getElementById("sendPhoto");

const retakePhoto =
  document.getElementById("retakePhoto");

let cameraStream = null;

let photoBlob = null;


/* 同意チェック */

agree.addEventListener("change", function() {

  startButton.disabled = !agree.checked;

});


/* カメラ開始 */

startButton.addEventListener("click", async function() {

  const nickname =
    document.getElementById("nickname").value.trim();

  if (nickname === "") {

    alert("ニックネームを入力してください。");

    return;

  }


  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    camera.srcObject =
      cameraStream;

    startArea.style.display =
      "none";

    cameraArea.style.display =
      "block";

  }

  catch(error) {

    alert(
      "カメラを使用できませんでした。カメラの使用を許可してください。"
    );

    console.error(error);

  }

});


/* 写真撮影 */

takePhoto.addEventListener("click", function() {

  const canvas =
    document.createElement("canvas");

  canvas.width =
    camera.videoWidth;

  canvas.height =
    camera.videoHeight;


  const context =
    canvas.getContext("2d");


  /* 前面カメラの左右反転 */

  context.translate(
    canvas.width,
    0
  );

  context.scale(-1, 1);


  context.drawImage(
    camera,
    0,
    0,
    canvas.width,
    canvas.height
  );


  photo.src =
    canvas.toDataURL(
      "image/jpeg",
      0.9
    );


  /* Blobに変換 */

  canvas.toBlob(
    function(blob) {

      photoBlob = blob;

    },
    "image/jpeg",
    0.9
  );


  /* カメラ停止 */

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

  }


  cameraArea.style.display =
    "none";

  resultArea.style.display =
    "block";

});


/* 写真をSupabaseへ送信 */

sendPhoto.addEventListener("click", async function() {

  if (!photoBlob) {

    alert("写真がありません。");

    return;

  }


  sendPhoto.disabled =
    true;

  sendPhoto.textContent =
    "送信中...";


  try {

    const response =
      await fetch(
        "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/smooth-worker",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "image/jpeg"

          },

          body: photoBlob

        }
      );


    const result =
      await response.text();


    console.log(result);


    if (!response.ok) {

      throw new Error(result);

    }


    resultArea.style.display =
      "none";

    completeArea.style.display =
      "block";

  }

  catch(error) {

    console.error(error);

    alert(
      "写真の送信に失敗しました。もう一度試してください。"
    );

    sendPhoto.disabled =
      false;

    sendPhoto.textContent =
      "写真を送信する";

  }

});


/* もう一度撮影 */

retakePhoto.addEventListener("click", async function() {

  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    camera.srcObject =
      cameraStream;


    resultArea.style.display =
      "none";

    cameraArea.style.display =
      "block";

  }

  catch(error) {

    alert(
      "カメラを使用できませんでした。"
    );

  }

});

</script>

</body>
</html>
