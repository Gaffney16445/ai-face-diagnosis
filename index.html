<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI顔診断</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f5f7ff,
          #ffffff
        );

      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: white;

      border-radius: 20px;

      padding: 24px;

      margin-bottom: 20px;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;

      margin-top: 10px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      text-align: center;

      color: #666;

      line-height: 1.7;
    }

    label {
      display: block;

      margin-top: 15px;

      font-weight: bold;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;

      padding: 13px;

      margin-top: 7px;

      border:
        1px solid #ccc;

      border-radius: 10px;

      font-size: 16px;
    }

    .consentBox {
      margin-top: 20px;

      padding: 16px;

      border-radius: 12px;

      background: #f3f5ff;

      line-height: 1.7;
    }

    .consentBox label {
      display: flex;

      gap: 10px;

      align-items: flex-start;

      font-weight: normal;

      margin-top: 0;
    }

    .consentBox input {
      width: 20px;
      height: 20px;

      flex-shrink: 0;
    }

    button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #222;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 15px;
    }

    button:disabled {
      opacity: 0.45;

      cursor: not-allowed;
    }

    video {
      width: 100%;

      display: block;

      border-radius: 16px;

      background: black;

      margin-top: 15px;
    }

    canvas {
      display: none;
    }

    .status {
      padding: 12px;

      margin-top: 15px;

      background: #f1f1f1;

      border-radius: 10px;

      white-space: pre-wrap;

      line-height: 1.6;
    }

    .result {
      text-align: center;
    }

    .score {
      font-size: 64px;

      font-weight: bold;

      margin: 15px 0;
    }

    .resultBox {
      padding: 15px;

      background: #f7f7f7;

      border-radius: 12px;

      margin-top: 12px;

      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    .roomInfo {
      padding: 12px;

      background: #f1f1f1;

      border-radius: 10px;

      word-break: break-all;

      margin-top: 15px;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- ========================= -->
  <!-- 開始画面 -->
  <!-- ========================= -->

  <div
    id="startScreen"
    class="card"
  >

    <h1>
      🤖 AI顔診断
    </h1>

    <p class="subtitle">
      あなたの顔をAIで診断して<br>
      スコアをチェックしよう！
    </p>


    <!-- 名前 -->

    <label>
      名前
    </label>

    <input
      id="nameInput"
      type="text"
      placeholder="名前を入力してください"
      maxlength="30"
    >


    <!-- 年齢 -->

    <label>
      年齢
    </label>

    <input
      id="ageInput"
      type="number"
      placeholder="年齢を入力してください"
      min="1"
      max="120"
    >


    <!-- ルーム情報 -->

    <div
      id="roomInfo"
      class="roomInfo hidden"
    ></div>


    <!-- ★唯一の同意チェック -->

    <div class="consentBox">

      <label>

        <input
          id="consent"
          type="checkbox"
        >

        <span>
          このサイトへの顔の送信、Discordへの転載、ランキングへの転載への同意をお願いします。
        </span>

      </label>

    </div>


    <!-- 診断開始 -->

    <button
      id="startButton"
      disabled
    >
      診断を開始する
    </button>


    <div
      id="startStatus"
      class="status hidden"
    ></div>

  </div>



  <!-- ========================= -->
  <!-- カメラ画面 -->
  <!-- ========================= -->

  <div
    id="cameraScreen"
    class="card hidden"
  >

    <h2>
      📷 顔を撮影
    </h2>

    <p>
      カメラに顔が入るようにしてください。
    </p>


    <video
      id="video"
      autoplay
      playsinline
    ></video>


    <canvas
      id="canvas"
    ></canvas>


    <button
      id="captureButton"
    >
      📸 撮影する
    </button>


    <div
      id="cameraStatus"
      class="status"
    ></div>

  </div>



  <!-- ========================= -->
  <!-- 診断中 -->
  <!-- ========================= -->

  <div
    id="loadingScreen"
    class="card hidden"
  >

    <h2>
      🤖 AI診断中...
    </h2>

    <p>
      顔を分析しています。
    </p>

    <div
      id="loadingStatus"
      class="status"
    >
      少々お待ちください...
    </div>

  </div>



  <!-- ========================= -->
  <!-- 結果 -->
  <!-- ========================= -->

  <div
    id="resultScreen"
    class="card hidden"
  >

    <div class="result">

      <h1>
        🎉 診断結果
      </h1>


      <div
        id="score"
        class="score"
      >
        -- / 100
      </div>


      <div
        id="resultText"
        class="resultBox"
      ></div>


      <div
        id="expressionResult"
        class="resultBox"
      ></div>


      <div
        id="sendStatus"
        class="status"
      ></div>


      <button
        id="restartButton"
      >
        もう一度診断する
      </button>

    </div>

  </div>


</div>



<script>


/* ==================================================
   Supabase Edge Function
   ================================================== */

const PHOTO_RECEIVER_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/photo-receiver";


const SMOOTH_WORKER_URL =
  "https://crdvhjtoxqeuttrnhfhj.supabase.co/functions/v1/smooth-worker";



/* ==================================================
   URLからルームID
   ================================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const room =
  urlParams.get("room") || "";



/* ==================================================
   HTML要素
   ================================================== */

const startScreen =
  document.getElementById(
    "startScreen"
  );


const cameraScreen =
  document.getElementById(
    "cameraScreen"
  );


const loadingScreen =
  document.getElementById(
    "loadingScreen"
  );


const resultScreen =
  document.getElementById(
    "resultScreen"
  );


const nameInput =
  document.getElementById(
    "nameInput"
  );


const ageInput =
  document.getElementById(
    "ageInput"
  );


const consent =
  document.getElementById(
    "consent"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const startStatus =
  document.getElementById(
    "startStatus"
  );


const roomInfo =
  document.getElementById(
    "roomInfo"
  );


const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const captureButton =
  document.getElementById(
    "captureButton"
  );


const cameraStatus =
  document.getElementById(
    "cameraStatus"
  );


const loadingStatus =
  document.getElementById(
    "loadingStatus"
  );


const scoreElement =
  document.getElementById(
    "score"
  );


const resultText =
  document.getElementById(
    "resultText"
  );


const expressionResult =
  document.getElementById(
    "expressionResult"
  );


const sendStatus =
  document.getElementById(
    "sendStatus"
  );


const restartButton =
  document.getElementById(
    "restartButton"
  );



/* ==================================================
   カメラ
   ================================================== */

let stream = null;



/* ==================================================
   診断データ
   ================================================== */

let currentName = "";

let currentAge = null;

let currentScore = 0;



/* ==================================================
   ルーム表示
   ================================================== */

if (room) {

  roomInfo.classList.remove(
    "hidden"
  );

  roomInfo.textContent =
    "ルームID：" + room;

}



/* ==================================================
   同意チェック
   ==================================================

   ★ここが今回の重要部分

   この1つだけで

   ・顔写真送信
   ・Discord
   ・ランキング
   ・GitHubランキング

   全部の同意として扱う。

   ================================================== */

consent.addEventListener(
  "change",
  () => {

    startButton.disabled =
      !consent.checked;

  }
);



/* ==================================================
   診断開始
   ================================================== */

startButton.addEventListener(
  "click",
  async () => {


    /*
     * 念のためサーバー送信前にも
     * 同意を確認
     */

    if (!consent.checked) {

      alert(
        "同意チェックを入れてください。"
      );

      return;

    }


    const name =
      nameInput.value.trim();


    const age =
      Number(
        ageInput.value
      );


    if (!name) {

      alert(
        "名前を入力してください。"
      );

      return;

    }


    if (
      !Number.isFinite(age) ||
      age < 1 ||
      age > 120
    ) {

      alert(
        "正しい年齢を入力してください。"
      );

      return;

    }


    currentName =
      name;

    currentAge =
      age;


    startButton.disabled =
      true;


    startStatus.classList.remove(
      "hidden"
    );


    startStatus.textContent =
      "カメラを起動しています...";


    try {

      await startCamera();


      startScreen.classList.add(
        "hidden"
      );


      cameraScreen.classList.remove(
        "hidden"
      );


      cameraStatus.textContent =
        "カメラの準備ができました。顔を画面中央に合わせてください。";


    } catch (error) {

      console.error(error);


      startButton.disabled =
        false;


      startStatus.textContent =
        "カメラを起動できませんでした。\n" +
        (
          error.message ||
          "ブラウザのカメラ許可を確認してください。"
        );

    }

  }
);



/* ==================================================
   カメラ起動
   ================================================== */

async function startCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  stream =
    await navigator.mediaDevices.getUserMedia(
      {
        video: {
          facingMode:
            "user",

          width: {
            ideal: 720
          },

          height: {
            ideal: 720
          }
        },

        audio: false
      }
    );


  video.srcObject =
    stream;


  await video.play();

}



/* ==================================================
   撮影
   ================================================== */

captureButton.addEventListener(
  "click",
  async () => {


    /*
     * もう一度同意を確認
     */

    if (!consent.checked) {

      alert(
        "同意が解除されています。"
      );

      return;

    }


    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      alert(
        "カメラの映像が準備できていません。"
      );

      return;

    }


    captureButton.disabled =
      true;


    cameraStatus.textContent =
      "撮影しています...";


    try {


      /* ==============================
         Canvasにカメラ画像を描画
         ============================== */

      const width =
        video.videoWidth;


      const height =
        video.videoHeight;


      canvas.width =
        width;


      canvas.height =
        height;


      const context =
        canvas.getContext(
          "2d"
        );


      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      /* ==============================
         JPEG Blob
         ============================== */

      const blob =
        await new Promise(
          resolve => {

            canvas.toBlob(
              resolve,
              "image/jpeg",
              0.9
            );

          }
        );


      if (!blob) {

        throw new Error(
          "画像の作成に失敗しました。"
        );

      }


      /* ==============================
         カメラ停止
         ============================== */

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

        stream = null;

      }


      cameraScreen.classList.add(
        "hidden"
      );


      loadingScreen.classList.remove(
        "hidden"
      );


      loadingStatus.textContent =
        "AIが顔を分析しています...";


      /* ==============================
         スコア計算
         ============================== */

      const diagnosis =
        createDiagnosis();


      currentScore =
        diagnosis.total;


      /* ==============================
         結果表示
         ============================== */

      scoreElement.textContent =
        diagnosis.total +
        " / 100";


      resultText.innerHTML =
        `
          <strong>
            ${escapeHtml(currentName)}
          </strong>
          さんの診断結果です。
          <br><br>

          顔の印象スコア：
          <strong>
            ${diagnosis.total}
          </strong>
          / 100
        `;


      expressionResult.innerHTML =
        `
          😊 表情：
          ${escapeHtml(
            diagnosis.expression
          )}
          <br>

          ✨ 雰囲気：
          ${escapeHtml(
            diagnosis.mood
          )}
        `;


      loadingStatus.textContent =
        "写真を送信しています...";


      /* ==============================
         サーバーへ送信
         ============================== */

      await sendPhoto(
        blob,
        diagnosis.total
      );


      loadingScreen.classList.add(
        "hidden"
      );


      resultScreen.classList.remove(
        "hidden"
      );


    } catch (error) {

      console.error(error);


      loadingScreen.classList.add(
        "hidden"
      );


      cameraScreen.classList.remove(
        "hidden"
      );


      captureButton.disabled =
        false;


      cameraStatus.textContent =
        "エラーが発生しました。\n" +
        (
          error.message ||
          "もう一度試してください。"
        );

    }

  }
);



/* ==================================================
   診断スコア
   ================================================== */

function createDiagnosis() {


  /*
   * 現在のAI診断用スコア。
   *
   * 後から本物のAIモデルへ
   * 変更可能。
   */

  const expression =
    randomInt(
      70,
      99
    );


  const mood =
    randomInt(
      70,
      99
    );


  const face =
    randomInt(
      65,
      99
    );


  const total =
    Math.round(
      (
        expression +
        mood +
        face
      ) / 3
    );


  let expressionText =
    "自然な表情";


  if (
    expression >= 90
  ) {

    expressionText =
      "とても明るい表情";

  } else if (
    expression >= 80
  ) {

    expressionText =
      "明るく好印象な表情";

  }


  let moodText =
    "落ち着いた雰囲気";


  if (
    mood >= 90
  ) {

    moodText =
      "華やかで魅力的な雰囲気";

  } else if (
    mood >= 80
  ) {

    moodText =
      "明るく親しみやすい雰囲気";

  }


  return {

    total,

    expression:
      expressionText,

    mood:
      moodText

  };

}



/* ==================================================
   写真送信
   ================================================== */

async function sendPhoto(
  imageBlob,
  score
) {


  /*
   * ★重要
   *
   * 同意OFFなら絶対に送信しない。
   */

  if (!consent.checked) {

    throw new Error(
      "同意が確認できないため、写真は送信されませんでした。"
    );

  }


  let url = "";



  /* ==================================================
     ルームあり
     ================================================== */

  if (room) {

    url =
      PHOTO_RECEIVER_URL +
      "?room=" +
      encodeURIComponent(
        room
      ) +

      "&nickname=" +
      encodeURIComponent(
        currentName
      ) +

      "&age=" +
      encodeURIComponent(
        currentAge
      ) +

      "&score=" +
      encodeURIComponent(
        score
      ) +

      /*
       * ★1個の同意チェックを
       * ランキング同意にも使用
       */

      "&rankingConsent=" +
      encodeURIComponent(
        consent.checked
      );

  }


  /* ==================================================
     ルームなし
     ================================================== */

  else {

    url =
      SMOOTH_WORKER_URL;

  }



  /* ==================================================
     ヘッダー
     ================================================== */

  const headers = {

    "Content-Type":
      "image/jpeg",

    /*
     * 名前
     */

    "x-name":
      currentName,

    /*
     * 年齢
     */

    "x-age":
      String(
        currentAge
      ),

    /*
     * スコア
     */

    "x-score":
      String(
        score
      ),

    /*
     * ★ランキング同意
     *
     * ここも同じチェックボックス
     */

    "x-ranking-consent":
      consent.checked
        ? "true"
        : "false",

    /*
     * 通常モード
     */

    "x-test-mode":
      "false"

  };



  /* ==================================================
     送信
     ================================================== */

  const response =
    await fetch(
      url,
      {
        method: "POST",

        headers,

        body:
          imageBlob
      }
    );


  const text =
    await response.text();


  let data;


  try {

    data =
      JSON.parse(
        text
      );

  } catch {

    data = {
      raw: text
    };

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      (
        "写真の送信に失敗しました。" +
        "\nHTTP " +
        response.status
      )
    );

  }


  sendStatus.textContent =
    "✅ 送信完了！\n" +
    "診断結果が正常に保存されました。";


  return data;

}



/* ==================================================
   もう一度診断
   ================================================== */

restartButton.addEventListener(
  "click",
  async () => {


    resultScreen.classList.add(
      "hidden"
    );


    startScreen.classList.remove(
      "hidden"
    );


    captureButton.disabled =
      false;


    startButton.disabled =
      !consent.checked;


    startStatus.classList.add(
      "hidden"
    );


    sendStatus.textContent =
      "";


    scoreElement.textContent =
      "-- / 100";


    resultText.textContent =
      "";


    expressionResult.textContent =
      "";


    window.scrollTo(
      0,
      0
    );

  }
);



/* ==================================================
   ランダム整数
   ================================================== */

function randomInt(
  min,
  max
) {

  return Math.floor(
    Math.random() *
    (
      max -
      min +
      1
    )
  ) + min;

}



/* ==================================================
   HTMLエスケープ
   ================================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


</script>

</body>

</html>
