<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI顔診断</title>

<style>

body {
    margin: 0;
    font-family: sans-serif;
    background: #f5f5f5;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 420px;
    margin: 80px auto;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    font-size: 30px;
}

p {
    color: #555;
}

input {
    width: 100%;
    padding: 15px;
    margin: 15px 0;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 16px;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>AI顔診断</h1>

        <p>
            あなたの顔をAIが診断します。
        </p>

        <input
            type="text"
            placeholder="ニックネーム"
            maxlength="20"
        >

        <button>
            AI顔診断を開始
        </button>

    </div>

</div>

</body>

</html>
